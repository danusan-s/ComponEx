
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multiplayer_demo_windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-ntldd
            zip

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRENDERER_BACKEND=vulkan \
            -DCOMPONENG_NETWORKING=ON \
            -DCOMPONENG_MARCH=x86-64-v3 \
            -DCOMPONENG_WERROR=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build
        run: cmake --build build --target MultiplayerDemo

      - name: Package
        run: |
          # The exe is linked -static, so this should only find glfw3.dll (the
          # engine links GLFW's DLL import library; it only needs system DLLs).
          # It is also the safety net: if any library still comes in as a DLL
          # (glslang, SPIRV-Tools...), it and its runtime (libwinpthread,
          # libstdc++, libgcc_s) are copied too, recursively.
          # Windows system DLLs are skipped, and so is vulkan-1.dll: that is the
          # loader and has to be the one the GPU driver installed.
          # Without libwinpthread-1.dll next to the exe, Windows picks whichever
          # copy is first on PATH (Git, an old MinGW...) and fails with
          # "clock_gettime64 could not be located".
          copy_runtime_dlls() {
            local exe="$1"
            local destination="$2"
            local dll

            ntldd -R "$exe" | awk '/=>/ && $3 != "not" {print $3}' | while read -r dll; do
              dll="$(cygpath -u "$dll")"
              case "$dll" in
                "$MSYSTEM_PREFIX"/bin/*) ;;
                *) continue ;;
              esac
              case "$(basename "$dll" | tr 'A-Z' 'a-z')" in
                vulkan-1.dll) continue ;;
              esac
              cp -v "$dll" "$destination/"
            done
          }

          mkdir -p dist/MultiplayerDemo
          cp build/multiplayer_demo/MultiplayerDemo.exe dist/MultiplayerDemo/
          cp -r engine/assets dist/MultiplayerDemo/assets

          cp multiplayer_demo/release/*.bat multiplayer_demo/release/README.txt dist/MultiplayerDemo/
          sed -i 's/$/\r/' dist/MultiplayerDemo/*.bat dist/MultiplayerDemo/README.txt

          copy_runtime_dlls dist/MultiplayerDemo/MultiplayerDemo.exe dist/MultiplayerDemo

          ntldd -R dist/MultiplayerDemo/MultiplayerDemo.exe || true

          cd dist && zip -r MultiplayerDemo-windows-x64.zip MultiplayerDemo

      - uses: actions/upload-artifact@v4
        with:
          name: MultiplayerDemo-windows-x64
          path: |
            dist
            !dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiplayerDemo-windows-x64.zip

  forest_windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-ntldd
            zip

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRENDERER_BACKEND=vulkan \
            -DCOMPONENG_NETWORKING=OFF \
            -DCOMPONENG_MARCH=x86-64-v3 \
            -DCOMPONENG_WERROR=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build
        run: cmake --build build --target ForestDemo

      - name: Package
        run: |
          # The exe is linked -static, so this should only find glfw3.dll (the
          # engine links GLFW's DLL import library; it only needs system DLLs).
          # It is also the safety net: if any library still comes in as a DLL
          # (glslang, SPIRV-Tools...), it and its runtime (libwinpthread,
          # libstdc++, libgcc_s) are copied too, recursively.
          # Windows system DLLs are skipped, and so is vulkan-1.dll: that is the
          # loader and has to be the one the GPU driver installed.
          # Without libwinpthread-1.dll next to the exe, Windows picks whichever
          # copy is first on PATH (Git, an old MinGW...) and fails with
          # "clock_gettime64 could not be located".
          copy_runtime_dlls() {
            local exe="$1"
            local destination="$2"
            local dll

            ntldd -R "$exe" | awk '/=>/ && $3 != "not" {print $3}' | while read -r dll; do
              dll="$(cygpath -u "$dll")"
              case "$dll" in
                "$MSYSTEM_PREFIX"/bin/*) ;;
                *) continue ;;
              esac
              case "$(basename "$dll" | tr 'A-Z' 'a-z')" in
                vulkan-1.dll) continue ;;
              esac
              cp -v "$dll" "$destination/"
            done
          }

          mkdir -p dist/Forest/assets

          cp build/forest/ForestDemo.exe dist/Forest/Forest.exe
          cp -r engine/assets/. dist/Forest/assets/
          cp -r forest/assets/. dist/Forest/assets/

          copy_runtime_dlls dist/Forest/Forest.exe dist/Forest

          ntldd -R dist/Forest/Forest.exe || true

          cd dist && zip -r Forest-windows-x64.zip Forest

      - uses: actions/upload-artifact@v4
        with:
          name: Forest-windows-x64
          path: |
            dist
            !dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Forest-windows-x64.zip
